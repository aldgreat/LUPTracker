<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Greens Relaunch Ticket Trends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #F8F6F0;
      --card-bg: #FFFFFF;
      --primary-green: #0E3A2F;
      --accent-green: #1B5E4B;
      --text-dark: #1A221E;
      --text-muted: #5C6B64;
      --border-color: #E2ECE6;
      --shadow: 0 10px 30px rgba(14, 58, 47, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .header { text-align: center; max-width: 600px; margin-bottom: 2rem; }
    .logo { max-width: 180px; height: auto; margin-bottom: 1.5rem; }
    
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary-green);
      margin-bottom: 0.5rem;
    }

    .form-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 650px;
      box-shadow: var(--shadow);
    }

    .form-group { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--primary-green);
      margin-bottom: 0.5rem;
    }

    input[type="text"], input[type="email"], select, textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      background: #FAFAFA;
      color: var(--text-dark);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-green);
      background: #FFFFFF;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .checkbox-group input { width: 18px; height: 18px; accent-color: var(--primary-green); }

    .btn {
      width: 100%;
      padding: 0.875rem;
      background-color: var(--primary-green);
      color: #ffffff;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 1rem;
    }

    .btn:hover { background-color: var(--accent-green); }

    #statusMessage {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="LiU_logo_green.png" alt="Live It Up Logo" class="logo" />
    <h1>Super Greens Relaunch Ticket Trends</h1>
  </div>

  <div class="form-container">
    <form id="ticketForm">
      
      <div class="checkbox-group">
        <input type="checkbox" id="discount_20" name="discount_20">
        <label for="discount_20" style="margin-bottom: 0;">20% Discount Applied</label>
      </div>

      <div class="form-group">
        <label for="name">Customer Name</label>
        <input type="text" id="name" required>
      </div>

      <div class="form-group">
        <label for="email">Customer Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label for="gorgias_link">Gorgias Link</label>
        <input type="text" id="gorgias_link">
      </div>

      <div class="form-group">
        <label for="request">Request</label>
        <select id="request" required>
          <option value="">-- Select Request Type --</option>
          <option value="Cancel Subscription">Cancel Subscription</option>
          <option value="Replacement first; pause sub">Replacement first; pause sub</option>
          <option value="Store Credit (Refunded)">Store Credit (Refunded)</option>
          <option value="Store Credit (Not Claimed)">Store Credit (Not Claimed)</option>
          <option value="Other (See Notes)">Other (See Notes)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="sub_status">Sub Status</label>
        <select id="sub_status" required>
          <option value="">-- Select Sub Status --</option>
          <option value="Canceled">Canceled</option>
          <option value="Active">Active</option>
          <option value="TBD">TBD</option>
        </select>
      </div>

      <div class="form-group">
        <label for="order_status">Order Status</label>
        <select id="order_status" required>
          <option value="">-- Select Order Status --</option>
          <option value="Refunded">Refunded</option>
          <option value="Partially Shipped">Partially Shipped</option>
          <option value="Shipped">Shipped</option>
          <option value="TBD">TBD</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" rows="4"></textarea>
      </div>

      <button type="submit" class="btn" id="submitBtn">Submit Ticket</button>
      <div id="statusMessage"></div>
    </form>
  </div>

  <script>
    // Paste your Web App URL here
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyAQh1tTjJcSV1Q-iuoeAc-lqVt7GKXM3Yqc_kbbudHJWj05ZdLeH6Cccqq1qKG5bLy/exec';

    document.getElementById('ticketForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMessage');
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';
      statusMsg.innerText = '';

      const formData = {
        discount_20: document.getElementById('discount_20').checked ? 'True' : 'False',
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        gorgias_link: document.getElementById('gorgias_link').value,
        request: document.getElementById('request').value,
        sub_status: document.getElementById('sub_status').value,
        order_status: document.getElementById('order_status').value,
        notes: document.getElementById('notes').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      })
      .then(() => {
        statusMsg.style.color = '#0E3A2F';
        statusMsg.innerText = 'Ticket successfully recorded!';
        document.getElementById('ticketForm').reset();
      })
      .catch(error => {
        statusMsg.style.color = '#d9534f';
        statusMsg.innerText = 'Error submitting ticket.';
        console.error('Error:', error);
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Ticket';
      });
    });
  </script>
</body>
</html>
